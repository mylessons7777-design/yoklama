<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoklama Ekranı</title>
<style>
  :root{--bg:#f3f5f4;--panel:#fff;--fg:#17201c;--muted:#5d6b64;--line:#d9e0dc;--accent:#0f6b4f;--ok:#1d7a3e;--okbg:#dff1e5;--warn:#8a5a00;--warnbg:#fbefd6;--bad:#b3261e;--badbg:#f8dedc}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
  [hidden]{display:none!important}
  .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;padding:20px;max-width:1400px;margin:0 auto}
  @media (max-width:900px){.wrap{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  h1{font-size:20px;margin:0}
  h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .qrbox{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  #qr{width:min(470px,80vw);aspect-ratio:1;background:#fff;padding:14px;border-radius:8px}
  #qr img,#qr canvas{width:100%!important;height:auto!important}
  .big{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums}
  .bar{height:6px;background:var(--line);border-radius:3px;width:min(470px,80vw);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);transition:width 1.9s linear}
  .stack{display:flex;flex-direction:column;gap:16px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button{font:inherit;padding:9px 14px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  button.sec{background:transparent;color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8cc9b3;outline-offset:2px}
  input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;min-width:0;background:#fff;color:var(--fg)}
  .muted{color:var(--muted)}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600}
  .p-tamam{background:var(--okbg);color:var(--ok)} .p-konumsuz{background:var(--warnbg);color:var(--warn)} .p-reddedildi{background:var(--badbg);color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .tbl{overflow-x:auto;max-height:42vh}
  .closed{font-size:22px;color:var(--muted);padding:60px 10px}
  #girisekran{max-width:380px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
  #girisekran input,#girisekran button{padding:12px;font-size:17px}
  #sinifqr img,#sinifqr canvas{width:100%!important;height:auto!important}
  .bad{color:var(--bad)} .ok{color:var(--ok)}
  .sayi{display:flex;align-items:center;gap:10px}
  .ikon{width:40px;height:40px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ikon.kucuk{width:18px;height:18px;vertical-align:-3px}
  .kalan{font-size:20px;font-variant-numeric:tabular-nums}
  .arti{width:38px;height:38px;padding:0;font-size:22px;line-height:1;border-radius:50%}
  .perde{position:fixed;inset:0;background:rgba(15,25,20,.55);display:grid;place-items:center;z-index:20}
  .eklekart{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px}
  #sinifqr{width:min(380px,70vw);height:auto}
  .kapat{position:absolute;top:8px;right:8px;width:36px;height:36px;padding:0;font-size:22px;background:transparent;color:var(--muted);border-color:var(--line)}
</style>
</head>
<body>

<form id="girisekran" class="panel">
  <h1>Yoklama ekranı</h1>
  <label for="sifre">Öğretmen şifresi</label>
  <input id="sifre" type="password" autocomplete="current-password" required>
  <button>Giriş</button>
  <div id="girisnot" class="bad" aria-live="polite"></div>
</form>

<div class="wrap" id="ana" hidden>
  <section class="panel qrbox" aria-live="polite">
    <h1 id="baslik">Yoklama</h1>
    <div id="qrwrap" hidden><div id="qr"></div></div>
    <div class="bar" id="bar" hidden><i id="barfill"></i></div>
    <div id="kapali" class="closed">Yoklama kapalı</div>
    <div class="sayi"><svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span class="big" id="sayac">0</span></div>
    <div class="muted kalan" id="kalan"></div>
    <div class="bad" id="uyari"></div>
  </section>

  <div class="stack">
    <section class="panel">
      <h2>Yoklama</h2>
      <div class="row">
        <label for="sinif">Sınıf</label><select id="sinif" style="min-width:150px"><option disabled selected>Sınıf yok</option></select>
        <button id="sinifekle" class="arti" title="Sınıf ekle" aria-label="Sınıf ekle">+</button>
        <label for="ders">Ders</label><input id="ders" style="flex:1;min-width:140px">
      </div>
      <div class="row" style="margin-top:8px">
        <label for="dk">Süre (dk)</label><input id="dk" type="number" min="1" max="180" value="120" style="width:80px">
        <label for="r">Sınır (m)</label><input id="r" type="number" min="20" max="2000" style="width:80px">
        <button id="baslat">Başlat</button>
        <button id="bitir" class="sec">Bitir</button>
      </div>
    </section>

    <section class="panel">
      <h2>Kayıtlar</h2>
      <div class="tbl"><table><thead><tr><th>No</th><th>Ad Soyad</th></tr></thead>
        <tbody id="liste"><tr><td colspan="2" class="muted">—</td></tr></tbody></table></div>
      <div class="row" style="margin-top:10px"><button id="elleac" class="sec">+ Elle ekle</button></div>
      <form id="elleform" class="row" style="margin-top:8px" hidden>
        <input id="elleno" inputmode="numeric" placeholder="No" aria-label="Öğrenci no" style="width:140px">
        <input id="ellead" placeholder="Ad Soyad" aria-label="Ad Soyad" style="flex:1;min-width:140px">
        <button>Ekle</button>
        <span id="ellenot" aria-live="polite"></span>
      </form>
    </section>
  </div>
</div>

<div id="ekleperde" class="perde" hidden>
  <div class="panel eklekart" role="dialog" aria-label="Sınıf ekle">
    <button id="eklekapat" class="kapat" aria-label="Kapat">×</button>
    <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
    <div id="sinifqr"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="ayar.js"></script>
<script src="ortak.js"></script>
<script>
const $ = id => document.getElementById(id);
let tok = null, qr = null, sonJeton = '', rDolu = false, sinifDolu = '', zamanlayici = null, istekte = false;
try { tok = sessionStorage.getItem('yoklama_tok'); } catch (e) {}
const ogrenciAdresi = j => new URL('index.html?t=' + j, location.href).href;

function girisGoster(not) {
  tok = null; try { sessionStorage.removeItem('yoklama_tok'); } catch (e) {}
  clearInterval(zamanlayici); $('ana').hidden = true; $('girisekran').hidden = false; $('girisnot').textContent = not || '';
}
function anaGoster() {
  $('girisekran').hidden = true; $('ana').hidden = false;
  $('sinifqr').innerHTML = '';
  new QRCode($('sinifqr'), { text: new URL('sinif.html', location.href).href, width: 500, height: 500, correctLevel: QRCode.CorrectLevel.M });
  yenile(); clearInterval(zamanlayici); zamanlayici = setInterval(yenile, 2000);
}

async function ogretmenApi(govde) {
  const r = await api(Object.assign({ tok }, govde));
  if (r.yetki === false) { girisGoster(r.neden); throw new Error('yetki'); }
  return r;
}

async function yenile() {
  if (document.hidden) return; // sekme arkadayken Google'a istek gönderme
  if (istekte) return; istekte = true;
  let d;
  try { d = await ogretmenApi({ islem: 'durum' }); $('uyari').textContent = ''; }
  catch (e) { if (e.message !== 'yetki') $('uyari').textContent = 'Sunucuya ulaşılamıyor, yeniden deneniyor…'; istekte = false; return; }
  istekte = false;

  if (!rDolu) { $('r').value = d.yaricap; rDolu = true; }
  const adlar = d.siniflar.map(s => s.ad).join('|');
  if (adlar !== sinifDolu) {
    const onceki = sinifDolu ? sinifDolu.split('|') : [];
    const yeni = d.siniflar.map(s => s.ad).filter(a => !onceki.includes(a));
    sinifDolu = adlar;
    let secili = $('sinif').value;
    if (!$('ekleperde').hidden && yeni.length) { secili = yeni[0]; $('ekleperde').hidden = true; } // yeni sınıf eklendi
    $('sinif').innerHTML = d.siniflar.length ? '' : '<option disabled selected>Sınıf yok</option>';
    d.siniflar.forEach(s => { const o = document.createElement('option'); o.value = o.textContent = s.ad; $('sinif').appendChild(o); });
    if (secili && d.siniflar.some(s => s.ad === secili)) $('sinif').value = secili;
  }
  $('baslat').disabled = !d.siniflar.length || d.acik;

  $('qrwrap').hidden = !d.acik; $('bar').hidden = !d.acik; $('kapali').hidden = d.acik;
  $('baslik').textContent = d.acik ? [d.oturum.ders, d.oturum.sinif].filter(Boolean).join(' · ') || 'Yoklama' : 'Yoklama';
  if (d.acik) {
    if (d.jeton !== sonJeton) {
      sonJeton = d.jeton;
      if (!qr) qr = new QRCode($('qr'), { text: ogrenciAdresi(d.jeton), width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
      else { qr.clear(); qr.makeCode(ogrenciAdresi(d.jeton)); }
    }
    $('barfill').style.width = Math.max(0, Math.min(100, d.sonraki / 10 * 100)) + '%';
    const k2 = d.oturum.kalan, sa = Math.floor(k2 / 3600), dk = Math.floor(k2 % 3600 / 60), sn = k2 % 60;
    $('kalan').textContent = '⏱ ' + (sa ? sa + ':' + String(dk).padStart(2, '0') : dk) + ':' + String(sn).padStart(2, '0');
  } else {
    sonJeton = ''; $('kalan').textContent = '';
    $('kapali').textContent = 'Yoklama kapalı';
  }

  const k = (d.kayitlar || []).filter(r => r.durum !== 'reddedildi');
  $('sayac').textContent = k.length;
  const tb = $('liste');
  tb.innerHTML = '';
  if (!k.length) tb.innerHTML = '<tr><td colspan="2" class="muted">—</td></tr>';
  [...k].reverse().forEach(r => {
    const tr = document.createElement('tr');
    [r.no, r.ad].forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); });
    tb.appendChild(tr);
  });
}

$('girisekran').onsubmit = async ev => {
  ev.preventDefault(); $('girisnot').textContent = '';
  try {
    const r = await api({ islem: 'giris', sifre: $('sifre').value });
    if (!r.ok) { $('girisnot').textContent = r.neden; return; }
    tok = r.tok; try { sessionStorage.setItem('yoklama_tok', tok); } catch (e) {}
    $('sifre').value = ''; anaGoster();
  } catch (e) { $('girisnot').textContent = 'Sunucuya ulaşılamadı. ayar.js içindeki adresi kontrol edin.'; }
};
$('baslat').onclick = async () => {
  $('baslat').disabled = true;
  try { const r = await ogretmenApi({ islem: 'baslat', sinif: $('sinif').value, ders: $('ders').value, dakika: +$('dk').value || 5 }); if (!r.ok) $('uyari').textContent = r.neden; } catch (e) {}
  yenile();
};
$('bitir').onclick = async () => { try { await ogretmenApi({ islem: 'bitir' }); } catch (e) {} yenile(); };
$('r').onchange = async () => { try { await ogretmenApi({ islem: 'yaricap', m: +$('r').value }); rDolu = false; } catch (e) {} yenile(); };
$('elleac').onclick = () => { $('elleform').hidden = !$('elleform').hidden; if (!$('elleform').hidden) $('elleno').focus(); };
$('elleform').onsubmit = async ev => {
  ev.preventDefault();
  const not = $('ellenot'); not.className = 'muted'; not.textContent = '…';
  try {
    const r = await ogretmenApi({ islem: 'elleEkle', no: $('elleno').value, ad: $('ellead').value });
    if (r.ok) { not.className = 'ok'; not.textContent = '✓ ' + r.no; $('elleno').value = ''; $('ellead').value = ''; $('elleno').focus(); yenile(); }
    else { not.className = 'bad'; not.textContent = r.neden; }
  } catch (e) { if (e.message !== 'yetki') { not.className = 'bad'; not.textContent = 'Gönderilemedi'; } }
};
$('sinifekle').onclick = () => { $('ekleperde').hidden = false; };
$('eklekapat').onclick = () => { $('ekleperde').hidden = true; };
$('ekleperde').onclick = ev => { if (ev.target === $('ekleperde')) $('ekleperde').hidden = true; };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') $('ekleperde').hidden = true; });

// Sekmeye geri dönülünce QR hemen yenilensin
document.addEventListener('visibilitychange', () => { if (!document.hidden && tok) yenile(); });

if (tok) anaGoster(); else girisGoster();
</script>
</body>
</html>
